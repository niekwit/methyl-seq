$schema: "https://json-schema.org/draft/2020-12/schema"
description: main configuration schema for the workflow
properties:
  genome:
    type: string
    enum: ["hg19", "hg38", "mm38", "mm39", "test"]
    description: "Genome assembly to use"
  ensembl_genome_build:
    type: integer
    description: "Ensembl genome build version"
  temp_dir:
    type: string
    description: "Temporary directory for intermediate files"
  trim_galore_args:
    type: string
    description: "Additional arguments to pass to Trim Galore"
  bismark:
    type: object
    description: "Extra Bismark arguments for each Bismark sub command"
    properties:
      align:
        type: string
        description: "Extra arguments for Bismark alignment"
      deduplicate:
        type: string
        description: "Extra arguments for Bismark deduplication"
      extract:
        type: string
        description: "Extra arguments for Bismark methylation extraction"
      coverage:
        type: string
        description: "Extra arguments for Bismark coverage report generation"
      report:
        type: string
        description: "Extra arguments for Bismark report generation"
    required:
      - align
      - deduplicate
      - extract
      - coverage
      - report
  deeptools:
    type: object
    description: "Deeptools parameters"
    properties:
      bigwig_summary:
        type: object
        properties:
          binSize:
            type: integer
            description: "Bin size for bigwig summary"
          extra:
            type: string
            description: "Extra arguments for bigwig summary"
        required:
          - binSize
          - extra
      plotPCA:
        type: object
        properties:
          extra:
            type: string
            description: "Extra arguments for plotPCA"
        required:
          - extra
    required:
      - bigwig_summary
      - plotPCA
  boxplot:
    type: object
    description: "% CpG methylation boxplots for different genomic regions"
    properties:
      plot:
        type: boolean
        description: "Whether to generate boxplots"
      cpg_n:
        type: integer
        description: "Number of CpGs per probe"
      min_reads:
        type: integer
        description: "Minimum reads covering a CpG to keep"
      regions:
        type: object
        description: "Optional extra custom genomic regions (name -> BED file path) to plot boxplots for, on top of the automatically generated standard regions"
        additionalProperties:
          type: string
      LINE1:
        type: object
        description: >-
          LINE1 (L1 family) repeat-element boxplot: repeat elements
          overlapping gene bodies are excluded, remaining LINE1 (repFamily
          "L1") elements are filtered by min_length, and per-subfamily
          subsets are additionally plotted (subfamily = repName prefix,
          matched at a "_" boundary -- "L1MdA" matches repName "L1MdA" or
          "L1MdA_I"/"L1MdA_II"/... but not "L1MdFanc_I" when configured as
          "L1MdF"). Also gates whether genic/promoter/cpg_islands regions
          get transposon-subtracted.
        properties:
          plot:
            type: boolean
            description: "Whether to generate the separate LINE1 boxplot figure"
          min_length:
            type: integer
            minimum: 0
            description: "Minimum element length (bp), applied after gene-body exclusion"
          subfamilies:
            type: array
            items:
              type: string
            description: >-
              Optional. LINE1 subfamily name prefixes (repeat_mask.bed
              repName values) to plot as separate subsets, in this order,
              alongside the "LINE1" total (all filtered LINE1 elements,
              always plotted first). If omitted, only the LINE1 total is
              plotted -- no per-subfamily breakdown.
        required:
          - plot
          - min_length
    required:
      - plot
      - cpg_n
      - min_reads
  metaplot:
    type: object
    description: "Average % CpG methylation across genomic regions"
    properties:
      plot:
        type: boolean
        description: "Whether to generate metaplots"
      extend:
        type: integer
        description: "Extend regions by this many bases on each side"
      regions:
        type: object
        description: "Genomic regions in BED format to plot metaplots for"
        additionalProperties:
          type: string
    required:
      - plot
      - extend
      - regions

required:
  - genome
  - ensembl_genome_build
  - bismark
  - deeptools
  - boxplot
