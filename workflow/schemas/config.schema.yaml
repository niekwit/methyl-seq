$schema: "https://json-schema.org/draft/2020-12/schema"
description: main configuration schema for the workflow
properties:
  genome:
    type: string
    enum: ["hg19", "hg38", "mm38", "mm39", "dm6", "test"]
    description: "Genome assembly to use"
  ensembl_genome_build:
    type: integer
    description: "Ensembl genome build version"
  temp_dir:
    type: string
    description: "Temporary directory for intermediate files"
  trim_galore_args:
    type: string
    description: "Additional arguments to pass to Trim Galore"
  bismark:
    type: object
    description: "Extra Bismark arguments for each Bismark sub command"
    properties:
      align:
        type: string
        description: "Extra arguments for Bismark alignment"
      deduplicate:
        type: string
        description: "Extra arguments for Bismark deduplication"
      extract:
        type: string
        description: "Extra arguments for Bismark methylation extraction"
      coverage:
        type: string
        description: >-
          Extra arguments for Bismark coverage/cytosine report generation
          (bismark_methylation_extractor --cytosine_report, run as part of
          the same methylation_extraction step as "extract" -- Bismark has
          no separate coverage2cytosine invocation in this workflow)
    required:
      - align
      - deduplicate
      - extract
      - coverage
  deeptools:
    type: object
    description: "Deeptools parameters"
    properties:
      bigwig_summary:
        type: object
        properties:
          binSize:
            type: integer
            description: "Bin size for bigwig summary"
          extra:
            type: string
            description: "Extra arguments for bigwig summary"
        required:
          - binSize
          - extra
      plotPCA:
        type: object
        properties:
          extra:
            type: string
            description: "Extra arguments for plotPCA"
        required:
          - extra
    required:
      - bigwig_summary
      - plotPCA
  boxplot:
    type: object
    description: "% CpG methylation boxplots for different genomic regions"
    properties:
      plot:
        type: boolean
        description: "Whether to generate boxplots"
      cpg_n:
        type: integer
        description: "Number of CpGs per probe"
      min_reads:
        type: integer
        description: "Minimum reads covering a CpG to keep"
      regions:
        type: object
        description: "Optional extra custom genomic regions (name -> BED file path) to plot boxplots for, on top of the automatically generated standard regions"
        additionalProperties:
          type: string
    required:
      - plot
      - cpg_n
      - min_reads
    additionalProperties:
      type: object
      description: >-
        TE class block, keyed by a repeat_mask.bed repClass value (e.g.
        LINE, LTR, SINE, DNA, RC, Retroposon -- genome/data-dependent, not
        enumerable here). Presence alone enables it and adds it to the
        combined TE boxplot (results/plots/te_boxplots.pdf): always
        produces a class-total region named after the block key, plus one
        region per listed family (if any) and one region per listed
        subfamily (if any, requires family). Repeat elements overlapping
        gene bodies are excluded first, then elements are filtered by
        min_length. Subfamily = repName prefix, matched at a "_" boundary
        -- "L1MdA" matches repName "L1MdA" or "L1MdA_I"/"L1MdA_II"/... but
        not "L1MdFanc_I" -- restricted to repFamily in the configured
        family/families.
      properties:
        min_length:
          type: integer
          minimum: 0
          description: "Minimum element length (bp), applied after gene-body exclusion"
        family:
          type: string
          description: >-
            Optional comma-separated repFamily value(s) to break the class
            total down by, e.g. "L1" or "L1,L2", in listed order.
        subfamilies:
          type: array
          items:
            type: string
          description: >-
            Optional repName prefixes to further break the family/families
            down by, in listed order. Requires "family".
        utr_analysis:
          type: object
          description: >-
            Optional 5' UTR vs. remainder %CpG methylation boxplot for
            LINE1 elements (ORF1/ORF2 located via minimap2 against a
            user-supplied GenBank consensus record). Only valid when this
            block's "family" is exactly "L1". Produces
            results/plots/te_5utr_boxplots.pdf, faceted by TE (this
            family's total + its configured subfamilies) x region (5'
            UTR / L1 remainder).
          properties:
            genbank:
              type: string
              description: >-
                Path to a GenBank record with ORF1 and ORF2 CDS features
                for a consensus LINE1 (the /product qualifiers must be
                exactly "ORF1" and "ORF2").
            min_identity:
              type: number
              minimum: 0
              maximum: 1
              description: "Minimum ORF hit identity (matched/aligned bases), default 0.6"
            min_coverage:
              type: number
              minimum: 0
              maximum: 1
              description: >-
                Minimum fraction of the consensus ORF length covered by
                the hit, default 0.5
            min_mapq:
              type: integer
              minimum: 0
              description: "Minimum minimap2 mapping quality for an ORF hit, default 20"
            single_orf:
              type: boolean
              description: >-
                Also annotate elements where only one of ORF1/ORF2 is
                confidently located, default false
            methylation_cutoff:
              type: number
              minimum: 0
              maximum: 100
              description: >-
                %CpG methylation cutoff (mean over each element's 5' UTR,
                per condition) used to classify elements as "low" or
                "high" methylation: mean >= cutoff -> high. Produces
                results/plots/te_5utr_methylation_histogram.pdf and
                per-TE, per-condition low/high BED files under
                results/te_5utr_status/. Default 50.
          required:
            - genbank
          additionalProperties: false
        profile:
          type: object
          description: >-
            Optional computeMatrix scale-regions / plotHeatmap / plotProfile
            settings for this class's own regions (the class total plus any
            configured family/subfamilies), using results/bigwig/{condition}.bw
            as signal and this block's own "min_length" as
            --regionBodyLength. Produces
            results/plots/te_{class_name}_heatmap.pdf and
            results/plots/te_{class_name}_profile.pdf. All keys optional.
          properties:
            upstream:
              type: integer
              minimum: 0
              description: "Region upstream of each element to include (bp), default 2000"
            downstream:
              type: integer
              minimum: 0
              description: "Region downstream of each element to include (bp), default 2000"
            binSize:
              type: integer
              minimum: 1
              description: "Bin size (bp) for signal averaging, default 100"
            extra:
              type: string
              description: "Extra arguments passed to computeMatrix, default none"
          additionalProperties: false
      required:
        - min_length
      dependentRequired:
        subfamilies: [family]
      if:
        required:
          - utr_analysis
      then:
        properties:
          family:
            const: "L1"
      additionalProperties: false
  DMR:
    type: object
    description: "Differentially methylated region (DMR) calling via methylKit"
    properties:
      run:
        type: boolean
        description: "Whether to run DMR calling"
      reference_condition:
        type: string
        description: "Condition to compare every other condition against; must match config/samples.csv"
      tile_size:
        type: integer
        description: "Genome tile size (bp) tested for differential methylation"
      step_size:
        type: integer
        description: >-
          Tile step size (bp); overlapping tiles are possible if less than
          tile_size
      min_per_group:
        type: integer
        description: "Minimum samples covered per group for a tile to be tested"
      difference_threshold:
        type: number
        description: >-
          Minimum absolute methylation difference (percentage points) for
          a tile to be called a DMR
      qvalue_threshold:
        type: number
        description: "Maximum q-value for a tile to be called a DMR"
      profile:
        type: object
        description: >-
          computeMatrix reference-point / plotHeatmap / plotProfile
          settings for CpG methylation centred on each DMR's midpoint,
          using results/bigwig/{condition}.bw as signal, run separately
          for hypo- and hypermethylated DMRs. Produces
          results/plots/dmrs/{status}_heatmap.pdf and
          results/plots/dmrs/{status}_profile.pdf.
        properties:
          upstream:
            type: integer
            minimum: 0
            description: "Region upstream of each DMR's centre to include (bp)"
          downstream:
            type: integer
            minimum: 0
            description: "Region downstream of each DMR's centre to include (bp)"
          binSize:
            type: integer
            minimum: 1
            description: "Bin size (bp) for signal averaging"
          extra:
            type: string
            description: "Extra arguments passed to computeMatrix"
        required:
          - upstream
          - downstream
          - binSize
          - extra
        additionalProperties: false
    required:
      - run
      - reference_condition
      - tile_size
      - step_size
      - min_per_group
      - difference_threshold
      - qvalue_threshold
      - profile
    additionalProperties: false

required:
  - genome
  - ensembl_genome_build
  - bismark
  - deeptools
  - boxplot
  - DMR
