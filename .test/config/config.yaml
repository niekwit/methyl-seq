genome: test # subsetted mm39 mini genome/GTF from .test/resources/ (see resources.py)
ensembl_genome_build: 114
temp_dir: /tmp # use "/local/" on Cambridge HPC

# https://felixkrueger.github.io/Bismark/bismark/library_types/
trim_galore_args: "--clip_R1 10 --clip_R2 10 --three_prime_clip_R1 10 --three_prime_clip_R2 10"

# Extra bismark arguments for each Bismark sub command
bismark:
  align: ""
  deduplicate: ""
  extract: ""
  coverage: ""

# Deeptools parameters
deeptools:
  bigwig_summary:
    binSize: 10000
    extra: ""
  plotPCA:
    extra: ""

# Box plot parameters
# % CpG methylation boxplots for different genomic regions
boxplot:
  plot: True
  # Number of CpGs per probe
  cpg_n: 50
  min_reads: 1 # minimum reads covering a CpG to keep
  # Standard regions (whole_genome, genic, exon, intron, intergenic, and
  # promoter/cpg_islands where available for the genome) are generated
  # automatically -- see the generate_regions rule in resources.smk.
  LINE:
    min_length: 100
    family: L1
    subfamilies:
      - L1MdA
      - L1MdF
      - L1MdTf
    utr_analysis:
      genbank: resources/L1_consensus_mm.gb
  LTR:
    min_length: 100

DMR:
  # methylKit settings for DMR calling
  run: True
  reference_condition: WT # should match config/samples.csv
  tile_size: 1000
  step_size: 1000
  min_per_group: 1
  difference_threshold: 25
  qvalue_threshold: 0.01
